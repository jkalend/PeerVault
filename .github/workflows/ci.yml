name: CI and experimental packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  qualify:
    name: R0 smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned component workspace
        run: |
          $commit = (Get-Content components-lock.txt -Raw).Trim()
          git clone --no-checkout https://github.com/jkalend/Components.git ../../Components
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C ../../Components checkout --detach $commit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (git -C ../../Components rev-parse HEAD).Trim()
          if ($actual -ne $commit) { throw "Components commit $actual does not match pinned $commit" }
          "Components commit: $commit" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Install pinned Rust
        run: rustup show
      - name: Formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and process-boundary tests
        run: cargo test --locked
      - name: Installer and evidence negative tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Documentation references
        run: python scripts/check-docs.py
      - name: Build
        run: cargo build --release --locked
      - name: Verify Windows recovery binary has no redistributable CRT
        if: runner.os == 'Windows'
        run: python scripts/check-windows-imports.py target/release/peervault.exe
      - name: Build Windows scheduler desktop
        if: runner.os == 'Windows'
        run: dotnet build desktop/PeerVault.Desktop/PeerVault.Desktop.csproj -c Release
      - name: Install checksum-pinned comparison backends
        run: python scripts/install-backends.py
      - name: V0.1 local capture/restore smoke
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python scripts/v01-smoke.py --binary "./target/release/peervault$suffix" --backend ".tools/restic$suffix" --root .peervault-work-v01-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.2 RecoveryKit smoke
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python scripts/v02-kit-smoke.py --binary "./target/release/peervault$suffix" --backend ".tools/restic$suffix" --root .peervault-work-v02-kit-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.3 peer-copy record smoke
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python scripts/v03-peer-copy.py --binary "./target/release/peervault$suffix" --backend ".tools/restic$suffix" --source-root .peervault-work-v03-source --peer-root .peervault-work-v03-peer --recovery-root .peervault-work-v03-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.5 retention preview/apply drill
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python scripts/v05-retention.py --binary "./target/release/peervault$suffix" --backend ".tools/restic$suffix" --root .peervault-work-v05-retention
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.6 metadata/path matrix drill
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python scripts/v06-matrix.py --binary "./target/release/peervault$suffix" --backend ".tools/restic$suffix" --root .peervault-work-v06-matrix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.6 cancellation and serialization drill
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python scripts/v06-cancel.py --binary "./target/release/peervault$suffix" --backend ".tools/restic$suffix" --root .peervault-work-v06-cancel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.8 owner-only IPC drill
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python scripts/v08-ipc.py --binary "./target/release/peervault$suffix" --backend ".tools/restic$suffix" --root .peervault-work-v08-ipc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.8 scheduler status, clock and quota drill
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python scripts/v08-schedule.py --binary "./target/release/peervault$suffix" --backend ".tools/restic$suffix" --root .peervault-work-v08-schedule
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.8 Windows DPAPI secret drill
        if: runner.os == 'Windows'
        run: |
          python scripts/v08-secret.py --binary ./target/release/peervault.exe --backend .tools/restic.exe --root .peervault-work-v08-secret
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.6 quota-style capacity drill
        if: runner.os == 'Linux'
        run: |
          python scripts/v06-capacity.py --binary ./target/release/peervault --backend .tools/restic --root .peervault-work-v06-capacity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V0.6 previous-candidate upgrade drill
        if: runner.os == 'Linux'
        run: |
          git worktree add --detach ../PeerVault-old bed15f2
          cargo build --release --manifest-path ../PeerVault-old/Cargo.toml
          python scripts/v06-upgrade.py --old-binary ../PeerVault-old/target/release/peervault --new-binary ./target/release/peervault --backend .tools/restic --root .peervault-work-v06-upgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe smoke environment
        run: python scripts/smoke-profile.py .tools/ci-profile.json
      - name: Independent full-size fixture oracles
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          & "./target/release/peervault$suffix" fixture .peervault-work-fixture-a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-fixture.py .peervault-work-fixture-a/source --revision 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./target/release/peervault$suffix" fixture .peervault-work-fixture-b --revision 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-fixture.py .peervault-work-fixture-b/source --revision 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: restic smoke baseline
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          & "./target/release/peervault$suffix" bakeoff restic --executable ".tools/restic$suffix" --work-dir .peervault-work-restic --profile .tools/ci-profile.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Kopia smoke baseline
        if: ${{ !cancelled() }}
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          & "./target/release/peervault$suffix" bakeoff kopia --executable ".tools/kopia$suffix" --work-dir .peervault-work-kopia --profile .tools/ci-profile.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Map experimental reports to inventoried evidence
        if: ${{ !cancelled() }}
        run: |
          $failedExports = 0
          foreach ($backend in @('restic', 'kopia')) {
            if (Test-Path ".peervault-work-$backend/evidence.json") {
              python scripts/evidence.py export ".peervault-work-$backend" .peervault-work-evidence --profile .tools/ci-profile.json
              if ($LASTEXITCODE -ne 0) { $failedExports++ }
            }
          }
          if ($failedExports -gt 0) { exit 1 }
      - name: Retain diagnostic reports (synthetic data only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r0-evidence-${{ matrix.os }}
          include-hidden-files: true
          path: .peervault-work-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Package experimental qualification tool
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          New-Item -ItemType Directory -Force -Path dist,dist/scripts,dist/tests/fixtures,dist/docs/profiles,dist/desktop | Out-Null
          Copy-Item "target/release/peervault$suffix" dist/
          Copy-Item README.md,LICENSE,backend-lock.json,components-lock.txt dist/ -ErrorAction Stop
          Copy-Item QUALIFICATION.md dist/QUALIFICATION.md -ErrorAction Stop
          Copy-Item docs/r0.md,docs/v0.1.md,docs/v0.2.md,docs/v0.3.md,docs/v0.5.md,docs/v0.6-corpus.md,docs/v0.6-matrix.md,docs/v0.8.md,docs/v0.9-measure.md,docs/support-policy.md,docs/compatibility.md,docs/runbook.md,docs/release-checklist.md,docs/security-review-scope.md,docs/security-review-2026-11-18.md,docs/license-review.md,docs/local-smoke-2026-11-03.md,docs/local-smoke-2026-11-18.md,docs/rc-readiness.md,docs/implementation-catch-up.md,docs/implementation-plan.md,docs/cp0-cp1-progress.md,docs/cp2-copy-drill.md,docs/windows-clean-drill.md,docs/implementation-plan-review.md,docs/planning-inputs.json dist/docs/ -ErrorAction Stop
          Copy-Item docs/policies dist/docs/policies -Recurse -ErrorAction Stop
          Copy-Item docs/profiles/* dist/docs/profiles/ -ErrorAction Stop
          Copy-Item scripts/install-backends.py,scripts/check-fixture.py,scripts/check-windows-imports.py,scripts/evidence.py,scripts/sbom.py,scripts/release-manifest.py,scripts/verify-package.py,scripts/v01-smoke.py,scripts/v02-kit-smoke.py,scripts/v02-clean-drill.py,scripts/v03-peer-copy.py,scripts/v05-retention.py,scripts/v06-matrix.py,scripts/v06-cancel.py,scripts/v06-cross-os.py,scripts/v06-capacity.py,scripts/v06-upgrade.py,scripts/v08-ipc.py,scripts/v08-schedule.py,scripts/v08-secret.py,scripts/secret-store.ps1,scripts/task-run.ps1,scripts/v09-measure.py,scripts/install-scheduler.ps1,scripts/uninstall-scheduler.ps1,scripts/install-scheduler.sh,scripts/uninstall-scheduler.sh,scripts/v06-corpus-smoke.py dist/scripts/ -ErrorAction Stop
          Copy-Item scripts/windows dist/scripts/windows -Recurse -ErrorAction Stop
          Copy-Item tests/fixtures/v1-a.json,tests/fixtures/v1-b.json dist/tests/fixtures/ -ErrorAction Stop
          if ($IsWindows) {
            Copy-Item desktop/PeerVault.Desktop/bin/Release/net10.0-windows/* dist/desktop/ -Recurse -ErrorAction Stop
          }
          python scripts/package-notices.py dist/THIRD-PARTY-NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/sbom.py --output dist/sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release-manifest.py --package "dist/peervault$suffix" --sbom dist/sbom.cdx.json --output dist/release-manifest.json --gate fmt=pass --gate clippy=pass --gate tests=pass
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            Compress-Archive -Path dist/* -DestinationPath peervault-${{ matrix.os }}.zip
          } else {
            tar -czf peervault-${{ matrix.os }}.tar.gz -C dist .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem peervault-*.zip,peervault-*.tar.gz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding utf8NoBOM
            Copy-Item dist/release-manifest.json "$($_.FullName).manifest.json"
            if ($IsWindows) {
              python scripts/verify-package.py $_.FullName --require-desktop
            } else {
              python scripts/verify-package.py $_.FullName
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Retain packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.os }}
          path: |
            peervault-*.zip
            peervault-*.tar.gz
            peervault-*.sha256
            peervault-*.manifest.json
          if-no-files-found: error

  release:
    name: Draft experimental release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: package-*
          merge-multiple: true
          path: packages
      - name: Create draft with verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" packages/* --verify-tag --draft --prerelease
          --title "PeerVault $RELEASE_TAG (experimental R0 tools)"
          --notes "Synthetic recovery qualification tooling. Not a supported backup release.
          R0 and V0.1 gates remain open; see docs/r0.md. Backends are external and not bundled."
