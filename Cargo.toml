[package]
name = "peervault"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "PeerVault recovery qualification tools (R0, experimental)"
publish = false

[dependencies]
anyhow = "1.0"
bailiff = { path = "../../Components/crates/bailiff" }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
fs2 = "0.4"
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1

[profile.release]
strip = true
