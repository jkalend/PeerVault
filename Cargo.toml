[package]
name = "peervault"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "PeerVault recovery qualification tools (R0, experimental)"
publish = false

[dependencies]
anyhow = "1.0"
bailiff = { path = "../../Components/crates/bailiff" }
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.release]
strip = true
